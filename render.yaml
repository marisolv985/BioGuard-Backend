services:
  - type: web
    name: bioguard-api
    runtime: docker
    plan: free

    dockerfilePath: ./BioGuard.Api/Dockerfile
    dockerContext: .

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: PORT
        value: "8080"

      - key: MONGODB_CONNECTION_STRING
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: ML__BaseUrl
        value: https://bioguard-ml.onrender.com
